name: Check sources

# Tests every news feed and sports API from GitHub's network (no database needed).
on:
  workflow_dispatch:
  push:
    paths: ["backend/config/sources.yaml", "backend/newspaper/ingest.py", "backend/newspaper/sports.py"]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Check every source
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          CRICKET_API_KEY: ${{ secrets.CRICKET_API_KEY }}
        run: python -m newspaper check-sources
