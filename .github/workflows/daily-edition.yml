name: Daily edition

# Publishes the day's edition at 06:00 Europe/Berlin. GitHub cron runs in UTC, so
# we wake at both 04:00 and 05:00 UTC (06:00 in summer and winter respectively);
# `--if-due` makes the early run a no-op in winter, and later backup runs fill in
# if GitHub delayed or skipped one. Publishing is idempotent.
on:
  schedule:
    - cron: "0 4 * * *"
    - cron: "0 5 * * *"
    - cron: "40 5 * * *"
    - cron: "40 6 * * *"
    - cron: "40 8 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild today's edition even if it is already published"
        type: boolean
        default: false

concurrency:
  group: daily-edition
  cancel-in-progress: false

permissions:
  contents: write   # only for the keep-alive commit below

jobs:
  edition:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
      CRICKET_API_KEY: ${{ secrets.CRICKET_API_KEY }}
      THESPORTSDB_KEY: ${{ secrets.THESPORTSDB_KEY }}
      OWNER_EMAIL: ${{ vars.OWNER_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip until the database is configured
        id: gate
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::notice::DATABASE_URL secret not set yet — see SETUP.md. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - if: steps.gate.outputs.skip != 'true'
        run: pip install -r requirements.txt
      - name: Build and publish today's edition
        if: steps.gate.outputs.skip != 'true'
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            python -m newspaper daily --force
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python -m newspaper daily
          else
            python -m newspaper daily --if-due
          fi

      # GitHub pauses scheduled workflows in public repos after 60 days without a
      # commit. A tiny monthly commit keeps the newsroom running indefinitely.
      - name: Keep scheduled workflows alive
        if: github.event_name == 'schedule'
        working-directory: .
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            date -u +%Y-%m-%dT%H:%M:%SZ > .github/keepalive
            git config user.name "newsroom-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/keepalive
            git commit -m "Keep scheduled workflows active"
            git push
          fi
