name: Daily edition

on:
  schedule:
    # 06:00 IST / 00:30 UTC every day — change to suit your morning.
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild today's edition even if it already exists"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["config.yaml", "newspaper/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-edition
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover tests

      - name: Build edition
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # Config/code change: only re-render existing editions (if any) — no new API spend.
            if ls editions/*.json >/dev/null 2>&1; then
              python -m newspaper --render-only
            else
              python -m newspaper
            fi
          elif [ "${{ inputs.force }}" = "true" ]; then
            python -m newspaper --force
          else
            python -m newspaper
          fi

      - name: Save edition to the archive
        run: |
          git config user.name "daily-brief-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editions
          if ! git diff --cached --quiet; then
            git commit -m "Edition $(ls editions | sort | tail -1 | sed 's/.json//')"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
